<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vast World - NoClip Speed Edition</title>
<style>
body{margin:0;overflow:hidden;background:#4a86e8;}
canvas{display:block;}
#ui{position:absolute;bottom:40px;left:0;right:0;pointer-events:none;display:flex;justify-content:space-between;padding:0 40px;}
#joystick{width:120px;height:120px;background:rgba(0,0,0,0.3);border-radius:50%;pointer-events:auto;border:2px solid rgba(255,255,255,0.2);position:relative;}
#stick{width:50px;height:50px;background:rgba(255,255,255,0.4);border-radius:50%;position:absolute;left:35px;top:35px;}
#btn-group{display:flex; flex-direction:column; align-items:center; gap:15px; pointer-events:none;}
.btn{background:rgba(0,0,0,0.4); border-radius:50%; pointer-events:auto; display:flex; align-items:center; justify-content:center; color:white; font-family:sans-serif; font-weight:bold; user-select:none; border:1px solid rgba(255,255,255,0.2);}
#noclip-btn{width:70px; height:70px; font-size:11px; background:rgba(100,0,255,0.6); border: 2px solid #cc00ff; text-align:center;}
#jump{width:90px; height:90px; font-size:16px;}
</style>
</head>
<body>
<div id="ui">
  <div id="joystick"><div id="stick"></div></div>
  <div id="btn-group">
    <div id="noclip-btn" class="btn">NOCLIP<br>OFF</div>
    <div id="jump" class="btn">JUMP</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const skyColor = new THREE.Color(0x6eb1ff);
const waterFogColor = new THREE.Color(0x001a33);
scene.background = skyColor;
scene.fog = new THREE.Fog(skyColor, 2000, 50000);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 1.0, 100000);
const renderer = new THREE.WebGLRenderer({antialias:true, logarithmicDepthBuffer: true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

function createNoiseTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = "#999999";
  ctx.fillRect(0,0,256,256);
  for(let i=0; i<8000; i++) {
    ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.15})`;
    ctx.fillRect(Math.random()*256, Math.random()*256, 1, 1);
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(128, 128);
  return tex;
}
const terrainTex = createNoiseTexture();

function createSun() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(64,64,0,64,64,64);
  grad.addColorStop(0,'white'); grad.addColorStop(0.3,'rgba(255,245,200,0.8)'); grad.addColorStop(1,'transparent');
  ctx.fillStyle = grad; ctx.fillRect(0,0,128,128);
  const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), blending: THREE.AdditiveBlending }));
  sunSprite.scale.set(6000,6000,1); sunSprite.position.set(20000,25000,-30000);
  scene.add(sunSprite);
  const sunLight = new THREE.DirectionalLight(0xffffff, 1.6);
  sunLight.position.copy(sunSprite.position);
  scene.add(sunLight);
}
createSun();
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

const waterLevel = -15.5;
const waterMat = new THREE.MeshStandardMaterial({ 
  color: 0x0044cc, transparent: true, opacity: 0.7, roughness: 0.1, side: THREE.DoubleSide, depthWrite: false 
});
const water = new THREE.Mesh(new THREE.PlaneGeometry(1000000, 1000000), waterMat);
water.rotateX(-Math.PI/2); water.position.y = waterLevel;
water.renderOrder = -1;
scene.add(water);

class Perlin {
  constructor(){
    this.p = new Uint8Array(512);
    for(let i=0;i<256;i++) this.p[i]=i;
    for(let i=255;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [this.p[i], this.p[j]]=[this.p[j], this.p[i]]; }
    for(let i=0;i<256;i++) this.p[i+256]=this.p[i];
  }
  fade(t){ return t*t*t*(t*(t*6-15)+10); }
  lerp(t,a,b){ return a + t*(b-a); }
  grad(hash,x,y){ const h = hash & 15; return ((h<8?x:y) * ((h&1)?-1:1)) + ((h<4?y:(h==12||h==14?x:0)) * ((h&2)?-1:1)); }
  noise(x,y){
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, xf = x-Math.floor(x), yf = y-Math.floor(y);
    const u=this.fade(xf), v=this.fade(yf);
    const aa=this.p[this.p[X]+Y], ab=this.p[this.p[X]+Y+1], ba=this.p[this.p[X+1]+Y], bb=this.p[this.p[X+1]+Y+1];
    return this.lerp(v, this.lerp(u,this.grad(aa,xf,yf),this.grad(ba,xf-1,yf)), this.lerp(u,this.grad(ab,xf,yf-1),this.grad(bb,xf-1,yf-1)));
  }
}
const perlin = new Perlin();
function getTerrainHeight(x, z) {
  let y = -80, amp = 1500, freq = 0.00008;
  for(let i=0; i<7; i++) { y += perlin.noise(x * freq, z * freq) * amp; amp *= 0.48; freq *= 2.2; }
  return y;
}

const chunkSize = 4000, segments = 64, renderDistance = 5, chunks = {};
function createChunk(cx, cz) {
  const key = `${cx},${cz}`; if(chunks[key]) return;
  const geo = new THREE.PlaneGeometry(chunkSize, chunkSize, segments, segments);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position, colors = [], color = new THREE.Color();
  for(let i=0; i<pos.count; i++) {
    const x = pos.getX(i) + cx * chunkSize, z = pos.getZ(i) + cz * chunkSize, h = getTerrainHeight(x, z);
    pos.setY(i, h);
    const v = 0.8 + Math.random() * 0.2;
    if(h > 850) color.setRGB(1.5*v, 1.5*v, 1.6*v); // 초고휘도 만년설
    else if(h > 600) color.setRGB(0.4*v, 0.4*v, 0.5*v);
    else if(h > 300) color.setRGB(0.1*v, 0.3*v, 0.1*v);
    else if(h > 40)  color.setRGB(0.2*v, 0.5*v, 0.2*v);
    else if(h > waterLevel) {
        const t = (h - waterLevel) / (40 - waterLevel);
        const sand = new THREE.Color(0.7*v, 0.6*v, 0.4*v);
        const grass = new THREE.Color(0.2*v, 0.5*v, 0.2*v);
        color.copy(sand).lerp(grass, t);
    }
    else { 
        const depth = Math.min(1, Math.max(0, (h - waterLevel) / -400)); 
        color.set(0x2d251a).lerp(new THREE.Color(0x000510), depth); 
    }
    colors.push(color.r, color.g, color.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ 
    vertexColors: true, map: terrainTex, roughness: 0.9,
    polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 
  }));
  mesh.position.set(cx * chunkSize, 0, cz * chunkSize);
  scene.add(mesh); chunks[key] = mesh;
}

function updateChunks(px, pz) {
  const ccx = Math.round(px/chunkSize), ccz = Math.round(pz/chunkSize);
  for(let x=-renderDistance; x<=renderDistance; x++)
    for(let z=-renderDistance; z<=renderDistance; z++) createChunk(ccx+x, ccz+z);
}

const player = new THREE.Object3D();
player.position.set(0, 500, 0); scene.add(player);
let velY = 0, canJump = true, pitch = 0, joyId = null, lookId = null, lx=0, ly=0;
let isUnderwater = false, isNoClip = false;
const move = {x:0, z:0};

const joy=document.getElementById("joystick"), stick=document.getElementById("stick");
joy.addEventListener("touchstart", e => { e.preventDefault(); joyId = e.changedTouches[0].identifier; }, {passive: false});
window.addEventListener("touchstart", e => {
  for(const t of e.changedTouches) { if(t.target.className !== "btn" && t.target !== joy && t.target !== stick) { lookId = t.identifier; lx = t.clientX; ly = t.clientY; } }
}, {passive: false});
window.addEventListener("touchmove", e => {
  for(const t of e.touches) {
    if(t.identifier === joyId) {
      const r=joy.getBoundingClientRect(), dx=t.clientX-r.left-60, dy=t.clientY-r.top-60;
      const d=Math.min(40, Math.sqrt(dx*dx+dy*dy)), a=Math.atan2(dy,dx);
      move.x=Math.cos(a)*(d/40); move.z=Math.sin(a)*(d/40);
      stick.style.left=Math.cos(a)*d+35+"px"; stick.style.top=Math.sin(a)*d+35+"px";
    } else if(t.identifier === lookId) {
      player.rotation.y += (t.clientX-lx)*-0.004;
      pitch = Math.max(-1.5, Math.min(1.5, pitch+(t.clientY-ly)*-0.004));
      lx=t.clientX; ly=t.clientY;
    }
  }
}, {passive: false});
window.addEventListener("touchend", e => {
  for(const t of e.changedTouches) {
    if(t.identifier === joyId) { move.x=0; move.z=0; stick.style.left="35px"; stick.style.top="35px"; joyId=null; }
    else if(t.identifier === lookId) { lookId = null; }
  }
});

const jumpBtn = document.getElementById("jump");
const noclipBtn = document.getElementById("noclip-btn");

jumpBtn.addEventListener("touchstart", e => {
  e.preventDefault(); 
  if(isNoClip) return;
  if(isUnderwater) velY = 0.35; 
  else if(canJump) { velY = 0.55; canJump = false; }
}, {passive: false});

noclipBtn.addEventListener("touchstart", e => { 
  e.preventDefault(); 
  isNoClip = !isNoClip; 
  velY = 0;
  noclipBtn.innerHTML = isNoClip ? "NOCLIP<br>ON" : "NOCLIP<br>OFF";
  noclipBtn.style.background = isNoClip ? "rgba(255,0,0,0.8)" : "rgba(100,0,255,0.6)";
}, {passive: false});

function animate() {
  requestAnimationFrame(animate);
  
  // 바라보는 방향 벡터 계산 (노클립용 상하 포함)
  const lookDir = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(1,0,0), pitch).applyQuaternion(player.quaternion);
  const sideDir = new THREE.Vector3(1,0,0).applyQuaternion(player.quaternion);
  
  if(isNoClip) {
    // 🚀 노클립 모드: 10배 빠른 속도로 유령 이동 (바라보는 방향)
    const speed = 20.0; 
    player.position.addScaledVector(lookDir, -move.z * speed).addScaledVector(sideDir, move.x * speed);
  } else {
    // 🚶 일반 모드: 중력 및 지형 물리 적용
    const terrainH = getTerrainHeight(player.position.x, player.position.z) + 2.5;
    isUnderwater = player.position.y < (waterLevel + 0.5);
    const isInAir = player.position.y > terrainH + 0.1;
    
    let targetSpeed = isUnderwater ? 0.8 : 2.0;

    // 수평 방향만 추출 (fw.y = 0)
    const fw = new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
    fw.y = 0; fw.normalize();
    player.position.addScaledVector(fw, -move.z * targetSpeed).addScaledVector(sideDir, move.x * targetSpeed);

    if (isUnderwater) {
      velY += -0.004; velY *= 0.94;   
      jumpBtn.innerText = "SWIM";
      scene.background = waterFogColor; scene.fog.color.copy(waterFogColor); scene.fog.near = 0; scene.fog.far = 1200;
    } else {
      velY += -0.02;
      jumpBtn.innerText = "JUMP";
      scene.background = skyColor; scene.fog.color.copy(skyColor); scene.fog.near = 2000; scene.fog.far = 50000;
    }
    player.position.y += velY;

    if(player.position.y <= terrainH) {
      player.position.y = terrainH;
      if(velY < 0) velY = 0;
      canJump = true;
    }
  }

  updateChunks(player.position.x, player.position.z);
  camera.position.copy(player.position);
  const finalLook = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(1,0,0), pitch).applyQuaternion(player.quaternion);
  camera.lookAt(player.position.clone().add(finalLook));
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
