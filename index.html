<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Grid Space</title>
<style>
body { margin:0; overflow:hidden; background:#111; }
canvas { display:block; }

/* 조이스틱 */
#joystick{
  position:absolute;
  bottom:40px;
  left:30px;
  width:120px;
  height:120px;
  background:rgba(255,255,255,0.08);
  border-radius:50%;
  touch-action:none;
}
#stick{
  position:absolute;
  width:50px;
  height:50px;
  background:#00ccff;
  border-radius:50%;
  left:35px;
  top:35px;
}
</style>
</head>
<body>

<div id="joystick"><div id="stick"></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

// 세로 화면 대응
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 🔹 그리드
const grid = new THREE.GridHelper(200, 200, 0x4444ff, 0x222222);
scene.add(grid);

// 플레이어
const player = new THREE.Object3D();
player.position.set(0, 1.6, 5);
scene.add(player);

let move = {x:0, z:0};
const speed = 0.15;

// 조이스틱
const joy = document.getElementById("joystick");
const stick = document.getElementById("stick");
let joyId = null;

joy.addEventListener("touchstart", e=>{
  joyId = e.changedTouches[0].identifier;
});

joy.addEventListener("touchend", ()=>{
  move = {x:0, z:0};
  stick.style.left="35px";
  stick.style.top="35px";
  joyId = null;
});

joy.addEventListener("touchmove", e=>{
  for(const t of e.touches){
    if(t.identifier === joyId){
      const rect = joy.getBoundingClientRect();
      const dx = t.clientX - rect.left - 60;
      const dy = t.clientY - rect.top - 60;
      const max = 40;
      const mx = Math.max(-max, Math.min(max, dx));
      const my = Math.max(-max, Math.min(max, dy));
      stick.style.left = mx+60-25+"px";
      stick.style.top = my+60-25+"px";
      move.x = mx/max;
      move.z = my/max;
    }
  }
});

// 화면 드래그 시점
let lookId = null;
let lastX = 0;

window.addEventListener("touchstart", e=>{
  for(const t of e.changedTouches){
    if(t.identifier !== joyId){
      lookId = t.identifier;
      lastX = t.clientX;
    }
  }
});

window.addEventListener("touchmove", e=>{
  for(const t of e.touches){
    if(t.identifier === lookId){
      const dx = t.clientX - lastX;
      player.rotation.y -= dx * 0.005;
      lastX = t.clientX;
    }
  }
});

window.addEventListener("touchend", e=>{
  for(const t of e.changedTouches){
    if(t.identifier === lookId){
      lookId = null;
    }
  }
});

// 루프
function animate(){
  requestAnimationFrame(animate);

  const dir = new THREE.Vector3(move.x,0,move.z);
  dir.normalize();
  dir.applyAxisAngle(new THREE.Vector3(0,1,0), player.rotation.y);
  player.position.addScaledVector(dir, speed);

  camera.position.copy(player.position);
  camera.lookAt(
    player.position.x + Math.sin(player.rotation.y),
    player.position.y,
    player.position.z - Math.cos(player.rotation.y)
  );

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
