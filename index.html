<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mobile FPS</title>
<style>
body { margin:0; overflow:hidden; background:#222; }
canvas { display:block; }

/* 조이스틱 */
#joystick{
  position:absolute;
  bottom:40px;
  left:30px;
  width:120px;
  height:120px;
  background:rgba(255,255,255,0.08);
  border-radius:50%;
  touch-action:none;
}
#stick{
  position:absolute;
  width:50px;
  height:50px;
  background:#00ccff;
  border-radius:50%;
  left:35px;
  top:35px;
}

/* 점프 버튼 */
#jump{
  position:absolute;
  bottom:60px;
  right:40px;
  width:80px;
  height:80px;
  background:rgba(255,0,255,0.4);
  border-radius:50%;
  text-align:center;
  line-height:80px;
  color:white;
  font-weight:bold;
  touch-action:none;
}
</style>
</head>
<body>

<div id="joystick"><div id="stick"></div></div>
<div id="jump">JUMP</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x333333);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 밝은 조명
const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
scene.add(light);

// 그리드
const grid = new THREE.GridHelper(200, 200, 0xffffff, 0x888888);
scene.add(grid);

// 플레이어
const player = new THREE.Object3D();
player.position.set(0, 1.6, 5);
scene.add(player);

let velocityY = 0;
let canJump = true;
const gravity = -0.01;

let move = {x:0, z:0};
const speed = 0.15;

/* ------------------ 조이스틱 ------------------ */
const joy = document.getElementById("joystick");
const stick = document.getElementById("stick");
let joyId = null;

joy.addEventListener("touchstart", e=>{
  joyId = e.changedTouches[0].identifier;
});

joy.addEventListener("touchend", ()=>{
  move = {x:0, z:0};
  stick.style.left="35px";
  stick.style.top="35px";
  joyId = null;
});

joy.addEventListener("touchmove", e=>{
  for(const t of e.touches){
    if(t.identifier === joyId){
      const rect = joy.getBoundingClientRect();
      const dx = t.clientX - rect.left - 60;
      const dy = t.clientY - rect.top - 60;
      const max = 40;
      const mx = Math.max(-max, Math.min(max, dx));
      const my = Math.max(-max, Math.min(max, dy));
      stick.style.left = mx+60-25+"px";
      stick.style.top = my+60-25+"px";
      move.x = mx/max;
      move.z = my/max;
    }
  }
});

/* ------------------ 시점 (역 Y축) ------------------ */
let lookId = null;
let lastX = 0;
let lastY = 0;
let pitch = 0;

window.addEventListener("touchstart", e=>{
  for(const t of e.changedTouches){
    if(t.identifier !== joyId){
      lookId = t.identifier;
      lastX = t.clientX;
      lastY = t.clientY;
    }
  }
});

window.addEventListener("touchmove", e=>{
  for(const t of e.touches){
    if(t.identifier === lookId){
      const dx = t.clientX - lastX;
      const dy = t.clientY - lastY;

      player.rotation.y -= dx * 0.005;

      // 🔥 역 Y축 (위로 쓸면 아래 본다)
      pitch -= dy * 0.005;
      pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));

      lastX = t.clientX;
      lastY = t.clientY;
    }
  }
});

window.addEventListener("touchend", e=>{
  for(const t of e.changedTouches){
    if(t.identifier === lookId) lookId = null;
  }
});

/* ------------------ 점프 ------------------ */
const jumpBtn = document.getElementById("jump");
jumpBtn.addEventListener("touchstart", ()=>{
  if(canJump){
    velocityY = 0.2;
    canJump = false;
  }
});

/* ------------------ 루프 ------------------ */
function animate(){
  requestAnimationFrame(animate);

  // 이동 (시선 방향 기준)
  const forward = new THREE.Vector3(
    Math.sin(player.rotation.y),
    0,
    -Math.cos(player.rotation.y)
  );
  const right = new THREE.Vector3(
    Math.cos(player.rotation.y),
    0,
    Math.sin(player.rotation.y)
  );

  const dir = new THREE.Vector3();
  dir.addScaledVector(forward, -move.z);
  dir.addScaledVector(right, move.x);
  dir.normalize();

  player.position.addScaledVector(dir, speed);

  // 중력
  velocityY += gravity;
  player.position.y += velocityY;

  if(player.position.y <= 1.6){
    player.position.y = 1.6;
    velocityY = 0;
    canJump = true;
  }

  // 카메라 위치
  camera.position.copy(player.position);

  const lookDir = new THREE.Vector3(
    Math.sin(player.rotation.y) * Math.cos(pitch),
    Math.sin(pitch),
    -Math.cos(player.rotation.y) * Math.cos(pitch)
  );

  camera.lookAt(player.position.clone().add(lookDir));

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
