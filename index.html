<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Maze MultiTouch</title>
<style>
body { margin:0; overflow:hidden; background:black; }
#joystick {
  position:absolute;
  bottom:40px;
  left:40px;
  width:120px;
  height:120px;
  background:rgba(255,255,255,0.05);
  border-radius:50%;
  touch-action:none;
}
#stick {
  position:absolute;
  width:50px;
  height:50px;
  background:rgba(180,0,255,0.6);
  border-radius:50%;
  left:35px;
  top:35px;
}
#win {
  position:absolute;
  top:20px;
  width:100%;
  text-align:center;
  color:#ff00ff;
  font-size:24px;
  display:none;
}
</style>
</head>
<body>

<div id="win">탈출 성공</div>
<div id="joystick"><div id="stick"></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080008);

const camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,200);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// 약한 빛
scene.add(new THREE.AmbientLight(0x330033,0.6));

// 바닥
const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(60,60),
  new THREE.MeshStandardMaterial({color:0x140014})
);
floor.rotation.x=-Math.PI/2;
scene.add(floor);

// 미로
const size=15;
let maze=[];
for(let z=0;z<size;z++){
  maze[z]=[];
  for(let x=0;x<size;x++) maze[z][x]=1;
}
function carve(x,z){
  const dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5);
  for(const [dx,dz] of dirs){
    const nx=x+dx,nz=z+dz;
    if(nx>0&&nz>0&&nx<size-1&&nz<size-1&&maze[nz][nx]===1){
      maze[nz][nx]=0;
      maze[z+dz/2][x+dx/2]=0;
      carve(nx,nz);
    }
  }
}
maze[1][1]=0;
carve(1,1);

const walls=[];
const wallGeo=new THREE.BoxGeometry(1,3,1);
const wallMat=new THREE.MeshStandardMaterial({color:0x5500aa});
for(let z=0;z<size;z++){
  for(let x=0;x<size;x++){
    if(maze[z][x]===1){
      const wall=new THREE.Mesh(wallGeo,wallMat);
      wall.position.set(x-size/2,1.5,z-size/2);
      scene.add(wall);
      walls.push(wall);
    }
  }
}

// 플레이어
const player=new THREE.Object3D();
player.position.set(1-size/2,1.5,1-size/2);
scene.add(player);

// 도착
const goal=new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshStandardMaterial({color:0xff00ff,emissive:0xff00ff})
);
goal.position.set(size-2-size/2,0.5,size-2-size/2);
scene.add(goal);

// 이동
let move={x:0,z:0};
const speed=0.1;

// 조이스틱
const joy=document.getElementById("joystick");
const stick=document.getElementById("stick");
let joystickTouchId=null;

joy.addEventListener("touchstart",e=>{
  joystickTouchId=e.changedTouches[0].identifier;
});
joy.addEventListener("touchend",e=>{
  move={x:0,z:0};
  stick.style.left="35px";
  stick.style.top="35px";
  joystickTouchId=null;
});
joy.addEventListener("touchmove",e=>{
  for(const t of e.touches){
    if(t.identifier===joystickTouchId){
      const rect=joy.getBoundingClientRect();
      const x=t.clientX-rect.left-60;
      const y=t.clientY-rect.top-60;
      const max=40;
      const dx=Math.max(-max,Math.min(max,x));
      const dy=Math.max(-max,Math.min(max,y));
      stick.style.left=dx+60-25+"px";
      stick.style.top=dy+60-25+"px";
      move.x=dx/max;
      move.z=dy/max;
    }
  }
});

// 🔥 화면 드래그 회전 (멀티터치)
let lookTouchId=null;
let lastX=0;

window.addEventListener("touchstart",e=>{
  for(const t of e.changedTouches){
    if(t.identifier!==joystickTouchId){
      lookTouchId=t.identifier;
      lastX=t.clientX;
    }
  }
});

window.addEventListener("touchmove",e=>{
  for(const t of e.touches){
    if(t.identifier===lookTouchId){
      const dx=t.clientX-lastX;
      player.rotation.y-=dx*0.005;
      lastX=t.clientX;
    }
  }
});

window.addEventListener("touchend",e=>{
  for(const t of e.changedTouches){
    if(t.identifier===lookTouchId){
      lookTouchId=null;
    }
  }
});

// 충돌
function collide(newPos){
  for(const w of walls){
    if(newPos.distanceTo(w.position)<0.9) return true;
  }
  return false;
}

function animate(){
  requestAnimationFrame(animate);

  const dir=new THREE.Vector3(move.x,0,move.z);
  dir.normalize();
  dir.applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y);

  const newPos=player.position.clone().addScaledVector(dir,speed);
  if(!collide(newPos)) player.position.copy(newPos);

  camera.position.copy(player.position);
  camera.lookAt(
    player.position.x + Math.sin(player.rotation.y),
    player.position.y,
    player.position.z - Math.cos(player.rotation.y)
  );

  if(player.position.distanceTo(goal.position)<1){
    document.getElementById("win").style.display="block";
  }

  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
