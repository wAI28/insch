<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Infinite Terrain</title>
<style>
body { margin:0; overflow:hidden; background:#87ceeb; }
canvas { display:block; }

#joystick{
  position:absolute;
  bottom:40px;
  left:30px;
  width:120px;
  height:120px;
  background:rgba(255,255,255,0.1);
  border-radius:50%;
  touch-action:none;
}
#stick{
  position:absolute;
  width:50px;
  height:50px;
  background:#00ccff;
  border-radius:50%;
  left:35px;
  top:35px;
}

#jump{
  position:absolute;
  bottom:60px;
  right:40px;
  width:80px;
  height:80px;
  background:rgba(255,0,255,0.4);
  border-radius:50%;
  text-align:center;
  line-height:80px;
  color:white;
  font-weight:bold;
  touch-action:none;
}
</style>
</head>
<body>

<div id="joystick"><div id="stick"></div></div>
<div id="jump">JUMP</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>

// ---------------- 기본 세팅 ----------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));

// ---------------- 노이즈 함수 ----------------
// 좌표 기반 의사 랜덤 (항상 같은 결과)
function noise(x, z){
  return Math.sin(x * 0.05) * Math.cos(z * 0.05);
}

// ---------------- 지형 생성 ----------------
const size = 1000;
const segments = 200;

const geometry = new THREE.PlaneGeometry(size, size, segments, segments);
geometry.rotateX(-Math.PI/2);

const vertices = geometry.attributes.position;

for(let i=0; i<vertices.count; i++){
  const x = vertices.getX(i);
  const z = vertices.getZ(i);

  // 자연스러운 경사
  const height =
    noise(x, z) * 5 +
    noise(x*0.5, z*0.5) * 10;

  vertices.setY(i, height);
}

geometry.computeVertexNormals();

const material = new THREE.MeshStandardMaterial({
  color: 0x2e8b57,
  flatShading: false
});

const terrain = new THREE.Mesh(geometry, material);
scene.add(terrain);

// ---------------- 플레이어 ----------------
const player = new THREE.Object3D();
player.position.set(0, 10, 5);
scene.add(player);

let velocityY = 0;
let canJump = true;
const gravity = -0.02;

let move = {x:0, z:0};
const maxSpeed = 0.3;

// ---------------- 조이스틱 ----------------
const joy = document.getElementById("joystick");
const stick = document.getElementById("stick");
let joyId = null;

joy.addEventListener("touchstart", e=>{
  joyId = e.changedTouches[0].identifier;
});

joy.addEventListener("touchend", ()=>{
  move = {x:0, z:0};
  stick.style.left="35px";
  stick.style.top="35px";
  joyId = null;
});

joy.addEventListener("touchmove", e=>{
  for(const t of e.touches){
    if(t.identifier === joyId){
      const rect = joy.getBoundingClientRect();
      const dx = t.clientX - rect.left - 60;
      const dy = t.clientY - rect.top - 60;
      const max = 40;

      const mx = Math.max(-max, Math.min(max, dx));
      const my = Math.max(-max, Math.min(max, dy));

      stick.style.left = mx+60-25+"px";
      stick.style.top = my+60-25+"px";

      move.x = mx/max;
      move.z = my/max;
    }
  }
});

// ---------------- 시점 (기존 세팅 유지) ----------------
let lookId = null;
let lastX = 0;
let lastY = 0;
let pitch = 0;

window.addEventListener("touchstart", e=>{
  for(const t of e.changedTouches){
    if(t.identifier !== joyId){
      lookId = t.identifier;
      lastX = t.clientX;
      lastY = t.clientY;
    }
  }
});

window.addEventListener("touchmove", e=>{
  for(const t of e.touches){
    if(t.identifier === lookId){
      const dx = t.clientX - lastX;
      const dy = t.clientY - lastY;

      player.rotation.y += dx * 0.005;
      pitch -= dy * 0.005;
      pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));

      lastX = t.clientX;
      lastY = t.clientY;
    }
  }
});

window.addEventListener("touchend", e=>{
  for(const t of e.changedTouches){
    if(t.identifier === lookId) lookId = null;
  }
});

// ---------------- 점프 ----------------
const jumpBtn = document.getElementById("jump");
jumpBtn.addEventListener("touchstart", ()=>{
  if(canJump){
    velocityY = 0.4;
    canJump = false;
  }
});

// ---------------- 플레이어 높이 계산 ----------------
function getHeight(x, z){
  return noise(x, z)*5 + noise(x*0.5, z*0.5)*10;
}

// ---------------- 루프 ----------------
function animate(){
  requestAnimationFrame(animate);

  const forward = new THREE.Vector3(
    Math.sin(player.rotation.y),
    0,
    -Math.cos(player.rotation.y)
  );
  const right = new THREE.Vector3(
    Math.cos(player.rotation.y),
    0,
    Math.sin(player.rotation.y)
  );

  const dir = new THREE.Vector3();
  dir.addScaledVector(forward, -move.z);
  dir.addScaledVector(right, move.x);

  if(dir.length() > 1) dir.normalize();
  player.position.addScaledVector(dir, maxSpeed);

  velocityY += gravity;
  player.position.y += velocityY;

  const groundHeight = getHeight(player.position.x, player.position.z) + 2;

  if(player.position.y <= groundHeight){
    player.position.y = groundHeight;
    velocityY = 0;
    canJump = true;
  }

  camera.position.copy(player.position);

  const lookDir = new THREE.Vector3(
    Math.sin(player.rotation.y) * Math.cos(pitch),
    Math.sin(pitch),
    -Math.cos(player.rotation.y) * Math.cos(pitch)
  );

  camera.lookAt(player.position.clone().add(lookDir));
  renderer.render(scene, camera);
}
animate();

</script>
</body>
</html>
