<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vast World - High Speed Flight</title>
<style>
body{margin:0;overflow:hidden;background:#a3d2ff;}
canvas{display:block;}
#ui{position:absolute;bottom:40px;left:0;right:0;pointer-events:none;display:flex;justify-content:space-between;padding:0 40px;}
#joystick{width:120px;height:120px;background:rgba(255,255,255,0.15);border-radius:50%;pointer-events:auto;border:2px solid rgba(255,255,255,0.2);position:relative;}
#stick{width:50px;height:50px;background:rgba(255,255,255,0.5);border-radius:50%;position:absolute;left:35px;top:35px;}
#btn-group{display:flex; flex-direction:column; align-items:center; gap:15px; pointer-events:none;}
.btn{background:rgba(255,255,255,0.2); border-radius:50%; pointer-events:auto; display:flex; align-items:center; justify-content:center; color:white; font-family:sans-serif; font-weight:bold; user-select:none; border:1px solid rgba(255,255,255,0.3);}
#jet{width:60px; height:60px; font-size:12px; background:rgba(255,50,0,0.5); border: 2px solid #ffcc00;}
#jump{width:90px; height:90px; font-size:16px;}
</style>
</head>
<body>
<div id="ui">
  <div id="joystick"><div id="stick"></div></div>
  <div id="btn-group">
    <div id="jet" class="btn">TURBO</div>
    <div id="jump" class="btn">JUMP</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const skyColor = new THREE.Color(0x82b4ff);
const waterFogColor = new THREE.Color(0x002b5c);
scene.background = skyColor;
scene.fog = new THREE.Fog(skyColor, 2000, 50000);

// 해안선 떨림(Z-fighting) 방지를 위해 Near값을 2.0으로 상향
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 2.0, 60000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

function createSun() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'white');
  grad.addColorStop(0.2, 'rgba(255, 255, 200, 0.8)');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 128, 128);
  const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), blending: THREE.AdditiveBlending }));
  sunSprite.scale.set(4000, 4000, 1);
  sunSprite.position.set(10000, 12000, -15000);
  scene.add(sunSprite);
  const sunLight = new THREE.DirectionalLight(0xffffff, 2);
  sunLight.position.copy(sunSprite.position);
  scene.add(sunLight);
}
createSun();
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

const waterLevel = -15.5; // 지형과의 수직 간격을 조금 더 벌림
const waterMat = new THREE.MeshStandardMaterial({
  color: 0x0055ff, transparent: true, opacity: 0.6, roughness: 0.1, side: THREE.DoubleSide
});
const water = new THREE.Mesh(new THREE.PlaneGeometry(150000, 150000), waterMat);
water.rotateX(-Math.PI/2); water.position.y = waterLevel;
scene.add(water);

class Perlin {
  constructor(){
    this.p = new Uint8Array(512);
    for(let i=0;i<256;i++) this.p[i]=i;
    for(let i=255;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [this.p[i], this.p[j]]=[this.p[j], this.p[i]]; }
    for(let i=0;i<256;i++) this.p[i+256]=this.p[i];
  }
  fade(t){ return t*t*t*(t*(t*6-15)+10); }
  lerp(t,a,b){ return a + t*(b-a); }
  grad(hash,x,y){ const h = hash & 15; return ((h<8?x:y) * ((h&1)?-1:1)) + ((h<4?y:(h==12||h==14?x:0)) * ((h&2)?-1:1)); }
  noise(x,y){
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, xf = x-Math.floor(x), yf = y-Math.floor(y);
    const u=this.fade(xf), v=this.fade(yf);
    const aa=this.p[this.p[X]+Y], ab=this.p[this.p[X]+Y+1], ba=this.p[this.p[X+1]+Y], bb=this.p[this.p[X+1]+Y+1];
    return this.lerp(v, this.lerp(u,this.grad(aa,xf,yf),this.grad(ba,xf-1,yf)), this.lerp(u,this.grad(ab,xf,yf-1),this.grad(bb,xf-1,yf-1)));
  }
}
const perlin = new Perlin();
function getTerrainHeight(x, z) {
  let y = -80, amp = 1500, freq = 0.00008;
  for(let i=0; i<7; i++) { y += perlin.noise(x * freq, z * freq) * amp; amp *= 0.48; freq *= 2.2; }
  return y;
}

const chunkSize = 4000, segments = 50, renderDistance = 4, chunks = {};
function createChunk(cx, cz) {
  const key = `${cx},${cz}`; if(chunks[key]) return;
  const geo = new THREE.PlaneGeometry(chunkSize, chunkSize, segments, segments);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position, colors = [], color = new THREE.Color();
  for(let i=0; i<pos.count; i++) {
    const x = pos.getX(i) + cx * chunkSize, z = pos.getZ(i) + cz * chunkSize, h = getTerrainHeight(x, z);
    pos.setY(i, h);
    if(h > 900) color.set(0xffffff);      
    else if(h > 500) color.set(0x444444); 
    else if(h > 200) color.set(0x5a9a5a); 
    else if(h > 35)  color.set(0x66cc66);  
    else if(h > -15) color.set(0xd2b48c);
    else { const d = Math.min(1, Math.max(0, (h + 15) / -285)); color.set(0xd2b48c).lerp(new THREE.Color(0x00081a), d); }
    colors.push(color.r, color.g, color.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  // 정밀도 보정을 위해 polygonOffsetFactor를 높임
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ 
    vertexColors: true, roughness: 0.9, 
    polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 4 
  }));
  mesh.position.set(cx * chunkSize, 0, cz * chunkSize);
  scene.add(mesh); chunks[key] = mesh;
}

function updateChunks(px, pz) {
  const ccx = Math.round(px/chunkSize), ccz = Math.round(pz/chunkSize);
  water.position.set(px, water.position.y, pz);
  for(let x=-renderDistance; x<=renderDistance; x++)
    for(let z=-renderDistance; z<=renderDistance; z++) createChunk(ccx+x, ccz+z);
}

const player = new THREE.Object3D();
player.position.set(0, 300, 0); scene.add(player);
let velY = 0, canJump = true, pitch = 0, joyId = null, lookId = null, lx=0, ly=0;
let isUnderwater = false, isJetpackOn = false;
const move = {x:0, z:0};

const joy=document.getElementById("joystick"), stick=document.getElementById("stick");
joy.addEventListener("touchstart", e => { e.preventDefault(); joyId = e.changedTouches[0].identifier; }, {passive: false});
window.addEventListener("touchstart", e => {
  for(const t of e.changedTouches) { if(t.target.className !== "btn" && t.target !== joy && t.target !== stick) { lookId = t.identifier; lx = t.clientX; ly = t.clientY; } }
}, {passive: false});
window.addEventListener("touchmove", e => {
  for(const t of e.touches) {
    if(t.identifier === joyId) {
      const r=joy.getBoundingClientRect(), dx=t.clientX-r.left-60, dy=t.clientY-r.top-60;
      const d=Math.min(40, Math.sqrt(dx*dx+dy*dy)), a=Math.atan2(dy,dx);
      move.x=Math.cos(a)*(d/40); move.z=Math.sin(a)*(d/40);
      stick.style.left=Math.cos(a)*d+35+"px"; stick.style.top=Math.sin(a)*d+35+"px";
    } else if(t.identifier === lookId) {
      player.rotation.y += (t.clientX-lx)*-0.004;
      pitch = Math.max(-1.5, Math.min(1.5, pitch+(t.clientY-ly)*-0.004));
      lx=t.clientX; ly=t.clientY;
    }
  }
}, {passive: false});
window.addEventListener("touchend", e => {
  for(const t of e.changedTouches) {
    if(t.identifier === joyId) { move.x=0; move.z=0; stick.style.left="35px"; stick.style.top="35px"; joyId=null; }
    else if(t.identifier === lookId) { lookId = null; }
  }
});

const jumpBtn = document.getElementById("jump");
const jetBtn = document.getElementById("jet");
jumpBtn.addEventListener("touchstart", e => {
  e.preventDefault(); if(isUnderwater) velY = 0.3; else if(canJump) { velY = 0.5; canJump = false; }
}, {passive: false});
jetBtn.addEventListener("touchstart", e => { e.preventDefault(); isJetpackOn = true; jetBtn.style.background = "#ff6600"; }, {passive: false});
jetBtn.addEventListener("touchend", e => { e.preventDefault(); isJetpackOn = false; jetBtn.style.background = "rgba(255,50,0,0.5)"; }, {passive: false});

function animate() {
  requestAnimationFrame(animate);
  const terrainH = getTerrainHeight(player.position.x, player.position.z) + 2.0;
  isUnderwater = player.position.y < (waterLevel + 1.2);
  const isInAir = player.position.y > terrainH + 1.0;

  // 속도 튜닝: 공중에 떠있을 때는 약 3.5의 속도로 지상(1.3)보다 훨씬 빠름
  let currentSpeed = 1.3;
  if (isUnderwater) currentSpeed = 0.7;
  else if (isInAir) currentSpeed = 3.5; 

  const fw = new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
  const rt = new THREE.Vector3(1,0,0).applyQuaternion(player.quaternion);
  player.position.addScaledVector(fw, -move.z * currentSpeed).addScaledVector(rt, move.x * currentSpeed);

  if(isJetpackOn) {
    velY += 0.07; 
    if(velY > 4.0) velY = 4.0;
    canJump = false;
  }

  if (isUnderwater) {
    velY += -0.004; velY *= 0.95;   
    if (player.position.y < waterLevel - 2) velY += 0.003; 
    jumpBtn.innerText = "SWIM";
    scene.background = waterFogColor; scene.fog.color.copy(waterFogColor); scene.fog.near = 0; scene.fog.far = 1500; waterMat.opacity = 0.4;
  } else {
    velY += -0.018;
    jumpBtn.innerText = "JUMP";
    scene.background = skyColor; scene.fog.color.copy(skyColor); scene.fog.near = 2500; scene.fog.far = 50000; waterMat.opacity = 0.6;
  }
  player.position.y += velY;

  if(player.position.y < terrainH) {
    player.position.y = terrainH;
    velY = 0;
    canJump = true;
  }

  updateChunks(player.position.x, player.position.z);
  camera.position.copy(player.position);
  const look = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(1,0,0), pitch).applyQuaternion(player.quaternion);
  camera.lookAt(player.position.clone().add(look));
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
